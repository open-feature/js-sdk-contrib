# The backend stack every OpenFeature conformance suite in this repository runs against. One file
# rather than one per provider, so two suites cannot drift onto different backends.
#
# Deliberately not the compose file the flagd e2e suites use, from the flagd-core test-harness
# submodule: that one bind-mounts ${FLAGS_DIR} into a shared host directory, so two stacks up at
# once rewrite each other's flags.
#
# The tag is pinned, and a conformance claim is pinned to it -- see the provider READMEs.
services:
  backend:
    image: ghcr.io/open-feature/flagd-testbed:v3.10.3
    ports:
      - 8013 # flagd RPC evaluation (gRPC) -- providers-flagd, rpc resolver
      - 8015 # flagd in-process sync (gRPC) -- providers-flagd, in-process resolver
      - 8016 # flagd OFREP over HTTP -- providers-ofrep
      - 8080 # launchpad control API -- every suite
